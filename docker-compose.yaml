services:
  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-s3
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      - ./scripts/seaweedfs/example-s3-config.json:/etc/seaweedfs/s3-config.json:ro
      - seaweedfs-data:/data
    command: >
      server
      -s3
      -s3.config=/etc/seaweedfs/s3-config.json
    restart: unless-stopped

  llm:
    build:
      context: ./llm
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  seaweedfs-data:
